<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Competição entre amigos: quem bebeu mais, quem saiu mais, quem levou mais fora e quem foi o MVP da noite.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>DrunkRats</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="logo">
      <img src="icons/icon.svg" alt="" width="40" height="40">
      <h1><span class="w">Drunk</span><span class="y">Rats</span></h1>
    </div>
  </header>

  <main id="view"></main>

  <nav id="tabs">
    <!-- Ícones de linha numa cor só (currentColor): branco inativo, amarelo ativo -->
    <button data-a="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h5v-6h3v6h5V10"/></svg>Início</button>
    <button data-a="tab" data-v="photos"><svg viewBox="0 0 24 24"><path d="M3.5 8h3.5l2-3h6l2 3h3.5v11.5h-17z"/><circle cx="12" cy="13.5" r="3.5"/></svg>Fotos</button>
    <button data-a="tab" data-v="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9.5L4 20.5z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/></svg>Conversa</button>
    <button data-a="tab" data-v="rank"><svg viewBox="0 0 24 24"><path d="M8 4h8v5.5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3.2 4.2M16 6h3a3 3 0 0 1-3.2 4.2"/><path d="M12 13.5V17M8 20.5h8M9.5 17h5v3.5h-5z"/></svg>Ranking</button>
    <button data-a="tab" data-v="challenges"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>Desafios</button>
    <button data-a="tab" data-v="crew"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><path d="M15.5 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.8 3.5 2.9 3.5 5.7"/></svg>Membros</button>
  </nav>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept="application/json" hidden>
  <input type="file" id="photoFile" accept="image/*" multiple hidden>
  <!-- Lançar: câmera direto (no celular) ou galeria -->
  <input type="file" id="launchCamera" accept="image/*" capture="environment" hidden>
  <input type="file" id="launchGallery" accept="image/*" hidden>

  <script src="app.js"></script>
</body>
</html>
