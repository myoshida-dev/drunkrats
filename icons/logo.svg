    <rect x="272" y="292" width="18" height="112" rx="9" fill="#FFDB7A"/>
    <!-- espuma: contorno por baixo, branco por cima -->
    <g fill="#111" stroke="#111" stroke-width="26">
      <circle cx="172" cy="246" r="30"/><circle cx="212" cy="228" r="32"/><circle cx="254" cy="232" r="30"/><circle cx="292" cy="248" r="26"/>
      <rect x="146" y="240" width="176" height="26" rx="10"/><rect x="160" y="250" width="24" height="58" rx="12"/><rect x="262" y="250" width="20" height="40" rx="10"/>
